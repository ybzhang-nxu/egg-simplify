# Deprecated: prefer M2_gene_channel_no_interleave_w9.toml (full run) and
# M2_gene_channel_no_interleave_count_w12.toml (count-only).
[experiment]
id = "M2_gene_channel_no_interleave"
out_dir = "reports/m2/M2_gene_channel_no_interleave"
w_min = 1
w_max = 12

[alphabet]
vars = ["t"]

[[alphabet.letters]]
name = "a1"
expr = "(+ 1 t)"
channel = "A"

[[alphabet.letters]]
name = "a2"
expr = "(+ 2 t)"
channel = "A"

[[alphabet.letters]]
name = "b1"
expr = "(+ 3 t)"
channel = "B"

[[alphabet.letters]]
name = "b2"
expr = "(+ 4 t)"
channel = "B"

[constraints]
adjacency_mode = "forbid"
adjacency_pairs = []

[constraints.automaton]
[[constraints.automaton.acceptors]]
kind = "genealogical"
seen = "channel"
rules = [
  { if_seen = "A", forbid = ["B"] }
]

[constraints.budget]
max_words = 20000000
max_states = 100000
max_transitions = 500000
