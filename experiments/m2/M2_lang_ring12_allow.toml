[experiment]
id = "M2_lang_ring12_allow"
out_dir = "reports/m2/M2_lang_ring12_allow"
w_min = 1
w_max = 14

[alphabet]
vars = ["t"]

[[alphabet.letters]]
name = "l00"
expr = "t"

[[alphabet.letters]]
name = "l01"
expr = "(+ 1 t)"

[[alphabet.letters]]
name = "l02"
expr = "(+ 2 t)"

[[alphabet.letters]]
name = "l03"
expr = "(+ 3 t)"

[[alphabet.letters]]
name = "l04"
expr = "(+ 4 t)"

[[alphabet.letters]]
name = "l05"
expr = "(+ 5 t)"

[[alphabet.letters]]
name = "l06"
expr = "(+ 6 t)"

[[alphabet.letters]]
name = "l07"
expr = "(+ 7 t)"

[[alphabet.letters]]
name = "l08"
expr = "(+ 8 t)"

[[alphabet.letters]]
name = "l09"
expr = "(+ 9 t)"

[[alphabet.letters]]
name = "l10"
expr = "(+ 10 t)"

[[alphabet.letters]]
name = "l11"
expr = "(+ 11 t)"

[constraints]
first_entry = ["l00", "l01", "l02", "l03"]
adjacency_mode = "allow"
adjacency_pairs = [
  ["l00", "l01"], ["l01", "l02"], ["l02", "l03"], ["l03", "l04"],
  ["l04", "l05"], ["l05", "l06"], ["l06", "l07"], ["l07", "l08"],
  ["l08", "l09"], ["l09", "l10"], ["l10", "l11"], ["l11", "l00"],
  ["l01", "l00"], ["l02", "l01"], ["l03", "l02"], ["l04", "l03"],
  ["l05", "l04"], ["l06", "l05"], ["l07", "l06"], ["l08", "l07"],
  ["l09", "l08"], ["l10", "l09"], ["l11", "l10"], ["l00", "l11"]
]

[constraints.budget]
max_words = 5000000
max_transitions = 200000
max_states = 50000
