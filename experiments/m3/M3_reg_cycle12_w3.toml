[experiment]
id = "M3_reg_cycle12_w3"
out_dir = "reports/m3/M3_reg_cycle12_w3"
w_min = 3
w_max = 3

[alphabet]
vars = ["x", "y"]

[[alphabet.letters]]
name = "l0"
expr = "(+ 1 (^ x 2))"

[[alphabet.letters]]
name = "l1"
expr = "(+ 2 (^ x 2))"

[[alphabet.letters]]
name = "l2"
expr = "(+ 3 (^ x 2))"

[[alphabet.letters]]
name = "l3"
expr = "(+ 4 (^ x 2))"

[[alphabet.letters]]
name = "l4"
expr = "(+ 5 (^ x 2))"

[[alphabet.letters]]
name = "l5"
expr = "(+ 6 (^ x 2))"

[[alphabet.letters]]
name = "l6"
expr = "(+ 7 (^ x 2))"

[[alphabet.letters]]
name = "l7"
expr = "(+ 8 (^ x 2))"

[[alphabet.letters]]
name = "l8"
expr = "(+ 9 (^ x 2))"

[[alphabet.letters]]
name = "l9"
expr = "(+ 10 (^ x 2))"

[[alphabet.letters]]
name = "l10"
expr = "(+ 11 (^ x 2))"

[[alphabet.letters]]
name = "l11"
expr = "(+ 12 (^ x 2))"

[constraints]
first_entry = ["l0", "l1", "l2", "l3", "l4", "l5", "l6", "l7", "l8", "l9", "l10", "l11"]
adjacency_mode = "allow"
adjacency_pairs = [
  ["l0", "l1"], ["l1", "l2"], ["l2", "l3"], ["l3", "l4"],
  ["l4", "l5"], ["l5", "l6"], ["l6", "l7"], ["l7", "l8"],
  ["l8", "l9"], ["l9", "l10"], ["l10", "l11"], ["l11", "l0"]
]
