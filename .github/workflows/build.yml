name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release -p egg-simplify

      - name: Upload linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-egg-simplify
          path: target/release/egg-simplify
