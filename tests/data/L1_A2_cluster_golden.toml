# Optional M2 additions: alphabet.letters[].channel, constraints.budget, constraints.automaton.acceptors (kgram/genealogical).
# See templates/m2_template.toml for a full schema example.
[experiment]
id = "L1_A2_cluster_golden"
title = "A2 pentagon adjacency golden (w<=6)"
out_dir = "OUT_DIR_REPLACED_IN_TEST"
w_min = 1
w_max = 6

[alphabet]
vars = ["x1", "x2"]

[[alphabet.letters]]
name = "x1"
expr = "x1"

[[alphabet.letters]]
name = "x2"
expr = "x2"

[[alphabet.letters]]
name = "x3"
expr = "(/ (+ 1 x2) x1)"

[[alphabet.letters]]
name = "x4"
expr = "(/ (+ 1 x1 x2) x1 x2)"

[[alphabet.letters]]
name = "x5"
expr = "(/ (+ 1 x1) x2)"

[constraints]
first_entry = ["x1", "x2"]
adjacency_mode = "allow"
adjacency_pairs = [
  ["x1","x2"], ["x2","x1"],
  ["x2","x3"], ["x3","x2"],
  ["x3","x4"], ["x4","x3"],
  ["x4","x5"], ["x5","x4"],
  ["x5","x1"], ["x1","x5"],
]

[pairs]
count_mode = "active_word_positions"
