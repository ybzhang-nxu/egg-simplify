# Optional M2 additions: alphabet.letters[].channel, constraints.budget, constraints.automaton.acceptors (kgram/genealogical).
# See templates/m2_template.toml for a full schema example.
[experiment]
id = "L3_Hexagon_Su_rational_subset"
title = "Hexagon functions: rational subset of S_u = {u,v,w,1-u,1-v,1-w}"
out_dir = "reports/m1/L3_Hexagon_Su_rational_subset"
w_min = 1
w_max = 6

[alphabet]
vars = ["u", "v", "w"]

[[alphabet.letters]]
name = "u"
expr = "u"

[[alphabet.letters]]
name = "v"
expr = "v"

[[alphabet.letters]]
name = "w"
expr = "w"

[[alphabet.letters]]
name = "1-u"
expr = "(+ 1 (- u))"

[[alphabet.letters]]
name = "1-v"
expr = "(+ 1 (- v))"

[[alphabet.letters]]
name = "1-w"
expr = "(+ 1 (- w))"

[constraints]
# First-entry condition in hexagon functions: u,v,w only.
first_entry = ["u", "v", "w"]
adjacency_mode = "forbid"
adjacency_pairs = []

[pairs]
count_mode = "active_word_positions"

