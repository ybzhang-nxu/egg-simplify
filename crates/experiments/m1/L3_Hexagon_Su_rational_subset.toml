[meta]
id = "L3_Hexagon_Su_rational_subset"
title = "Hexagon functions: rational subset of S_u = {u,v,w,1-u,1-v,1-w}"
kind = "literature"
source = "von Hippel (2015) slides: S_u alphabet and first-entry condition (use rational subset for M1)."

[weights]
min = 1
max = 6

[alphabet]
vars = ["u", "v", "w"]

[[alphabet.letters]]
name = "u"
expr = "u"

[[alphabet.letters]]
name = "v"
expr = "v"

[[alphabet.letters]]
name = "w"
expr = "w"

[[alphabet.letters]]
name = "1-u"
expr = "(+ 1 (- u))"

[[alphabet.letters]]
name = "1-v"
expr = "(+ 1 (- v))"

[[alphabet.letters]]
name = "1-w"
expr = "(+ 1 (- w))"

[constraints.first_entry]
# First-entry condition in hexagon functions: u,v,w only.
allowed = ["u", "v", "w"]

[constraints.adjacency]
mode = "none"
