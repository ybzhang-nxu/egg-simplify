[experiment]
id = "L1_A2_cluster"
title = "Cluster algebra A2 (pentagon) cluster variables + cluster adjacency as pair constraint"
out_dir = "reports/m1/L1_A2_cluster"
w_min = 1
w_max = 12

[alphabet]
vars = ["x1", "x2"]

[[alphabet.letters]]
name = "x1"
expr = "x1"

[[alphabet.letters]]
name = "x2"
expr = "x2"

# x3 = (1 + x2) / x1
[[alphabet.letters]]
name = "x3"
expr = "(/ (+ 1 x2) x1)"

# x4 = (1 + x1 + x2) / (x1 x2)
[[alphabet.letters]]
name = "x4"
expr = "(/ (+ 1 x1 x2) x1 x2)"

# x5 = (1 + x1) / x2
[[alphabet.letters]]
name = "x5"
expr = "(/ (+ 1 x1) x2)"

[constraints]
first_entry = ["x1", "x2"]
adjacency_mode = "allow"
adjacency_pairs = [
  # self-loops allowed (repeat letter)
  ["x1","x1"], ["x2","x2"], ["x3","x3"], ["x4","x4"], ["x5","x5"],

  # pentagon neighbor adjacency (bidirectional)
  ["x1","x2"], ["x2","x1"],
  ["x2","x3"], ["x3","x2"],
  ["x3","x4"], ["x4","x3"],
  ["x4","x5"], ["x5","x4"],
  ["x5","x1"], ["x1","x5"],
]

[pairs]
count_mode = "active_word_positions"
